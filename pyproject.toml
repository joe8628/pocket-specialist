[project]
name = "pocket-specialist"
version = "0.5.1b0"
description = "Local-first document intelligence pipeline."
requires-python = ">=3.11"

[project.scripts]
pocket-specialist = "pocket_specialist.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pyright]
pythonVersion = "3.11"
include = ["src", "tests"]
extraPaths = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
